name: Backend foundation CI

on:
  pull_request:
    branches: [main, 'feat/coherent-classification-history-read']

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Compiled Express smoke and middleware/error contract tests
        run: npm run test

      - name: Verify compiled artifacts without executing bootstrap
        run: |
          test -f dist/app.js
          test -f dist/server.js
          test -f dist/errors/authorizationError.js
          test -f dist/errors/forbiddenError.js
          test -f dist/errors/notFoundError.js
          test -f dist/errors/globalErrorHandler.js
          test -f dist/middlewares/auth.js
          test -f dist/middlewares/cors.js
          test -f dist/middlewares/logger.js

  mongodb-integration:
    name: Real MongoDB owner isolation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mongodb:
        # Official MongoDB 7.0.45, immutable multi-platform manifest.
        image: mongo:7.0.45@sha256:c53852c00c23ca9f23fc39690350ffa9a80e3642fe8f96879726d8da0abe80a7
        ports:
          - 127.0.0.1:27017:27017
        options: >-
          --tmpfs /data/db:rw,noexec,nosuid,size=512m
          --tmpfs /data/configdb:rw,noexec,nosuid,size=64m
          --log-driver none
          --health-cmd "mongosh --quiet --norc --eval 'quit(db.runCommand({ ping: 1 }).ok === 1 ? 0 : 1)'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 10s
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build compiled application
        run: npm run build

      - name: Verify integration runner rejects suite-hook failures
        run: npm run test:integration:runner

      - name: Real MongoDB financial ownership and cleanup
        env:
          MONGODB_INTEGRATION_TEST: '1'
          MONGODB_TEST_BASE_URI: mongodb://127.0.0.1:27017
          TZ: UTC
        run: npm run test:integration
